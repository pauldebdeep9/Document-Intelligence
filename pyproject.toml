[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isc-docint"
version = "0.1.0"
description = "ISC Document Intelligence & Knowledge Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pypdf>=4.2",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]
corpus = ["faker>=25.0", "reportlab>=4.2"]

[project.scripts]
isc = "isc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/isc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/isc"]
# Stubs land incrementally; keep the gate on the seams that matter.
[[tool.mypy.overrides]]
module = ["isc.ingest.*", "isc.parse.*", "isc.eval.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "acl: adversarial permission tests; must never be skipped in CI",
    "llm: requires a live model call",
]
