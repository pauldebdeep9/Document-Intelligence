[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isc-docint"
version = "0.1.0"
description = "Minimal document-intelligence PoC for Purchase Order extraction, embedding retrieval, and grounded question answering."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "reportlab>=4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/isc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/isc"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
