env: local

llm:
  provider: openai
  chat_model: gpt-4o-mini
  embed_model: text-embedding-3-small
  temperature: 0.0
  max_tokens: 2048
  timeout_s: 60.0
  max_retries: 3
  embed_batch_size: 64

cache:
  enabled: true

chunk:
  target_tokens: 512
  overlap_tokens: 64
  keep_tables_whole: true
  max_table_tokens: 1500

retrieval:
  top_k_dense: 20
  top_k_lexical: 20
  rrf_k: 60
  final_k: 8
  min_support_score: 0.35

# Routing policy for extracted fields. These are the numbers a process owner
# argues with, so they live in config and are justified by eval/calibration.
thresholds:
  auto_accept: 0.90
  review: 0.60
  reject: 0.30
