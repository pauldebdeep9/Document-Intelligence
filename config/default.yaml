env: local

llm:
  provider: openai
  chat_model: gpt-4o-mini
  embed_model: text-embedding-3-small
  temperature: 0.0
  # Measured, not guessed: structured PurchaseOrderRaw output costs ~53
  # completion tokens per line item; the largest corpus document (42 lines)
  # needs ~2,305, which the old 2048 cap exceeded above ~36 lines. 8192 gives
  # ~3.6x headroom (~151 line items) rather than ~1.8x, because this setting
  # is shared with P1-11's invoices and a cap that is merely adequate today
  # silently truncates after the next corpus change. This is a ceiling, not
  # an allocation -- only tokens actually generated are billed, so headroom
  # here costs nothing when unused. llm/structured.py fails fast on
  # finish_reason == "length" rather than relying on this number being right.
  max_tokens: 8192
  timeout_s: 60.0
  max_retries: 3
  embed_batch_size: 64

cache:
  enabled: true

chunk:
  target_tokens: 512
  overlap_tokens: 64
  keep_tables_whole: true
  # Measured against the real 20-doc corpus, not guessed: per-row cost is
  # ~43 tokens (median), and the four 42-line documents' page-1 table
  # portions run 1733-1883 tokens. At the original 1500 the largest tables
  # split into as few as 2 parts -- "rows 10-1180" is barely more useful as
  # a citation than "the table". 800 forces 3-4 parts of ~15-18 rows each,
  # matching prose chunks' retrieval-unit scale at target_tokens=512, while
  # leaving the common case (almost every table is under 250 tokens) whole.
  # See docs/adr/0007.
  max_table_tokens: 800

retrieval:
  top_k_dense: 20
  top_k_lexical: 20
  rrf_k: 60
  final_k: 8
  min_support_score: 0.35

# Routing policy for extracted fields. These are the numbers a process owner
# argues with, so they live in config and are justified by eval/calibration.
thresholds:
  auto_accept: 0.90
  review: 0.60
  reject: 0.30
